name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_ACTION }}
          # Deleting a branch is not in the action's default allowlist, so a run
          # asked to tidy merged branches stops for an approval no one is
          # present to give. Scoped to deletion alone: it authorises no other
          # git push, so a run cannot move, overwrite, or force a branch.
          #
          # main is not reachable this way regardless -- its ruleset has
          # `deletion` and `non_fast_forward` active, so the delete is refused
          # server-side.
          #
          # Nor can an outsider drive it. This workflow passes no `prompt`, so
          # it runs in tag mode, where the action requires the triggering actor
          # to hold write access *and* to be a real user account. The published
          # bypass -- a GitHub App passing the write check because its login
          # ends in "[bot]" -- applied to agent mode and was fixed in v1.0.94;
          # `@v1` floats above that. `allowed_non_write_users` is deliberately
          # unset, since that is the setting that would open this up.
          claude_args: '--allowedTools "Bash(git push origin --delete:*)"'
