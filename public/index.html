<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Patchbay</title>

    <!-- Desktop tab icon. iOS ignores SVG favicons for the home screen, which is
         why it needs the PNG below or it invents a black single-letter tile. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />

    <!-- Add to Home Screen on iOS: launches without Safari chrome. No
         viewport-fit=cover on purpose - without it iOS keeps content inside the
         safe areas by itself, so the notch and home indicator need no CSS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Patchbay" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Password gate -->
    <div id="gate" class="gate hidden">
      <form id="gate-form" class="gate-card">
        <h1>🎛️ Patchbay</h1>
        <p>Enter the app password to continue.</p>
        <input id="gate-input" type="password" placeholder="App password" autocomplete="current-password" />
        <button type="submit">Unlock</button>
        <p id="gate-error" class="error hidden"></p>
      </form>
    </div>

    <!-- Main app -->
    <div id="app" class="app hidden">
      <header>
        <h1>🎛️ Patchbay</h1>
        <p class="subtitle">Image &amp; video generation / editing across Pruna, xAI and Workers AI. Nothing is stored.</p>
      </header>

      <main>
        <section class="panel controls">
          <label class="field">
            <span class="field-label">Model</span>
            <select id="model-select"></select>
          </label>
          <p id="model-blurb" class="blurb"></p>

          <form id="gen-form">
            <div class="prompt-lib">
              <select id="prompt-select" aria-label="Saved prompts">
                <option value="">Saved prompts…</option>
              </select>
              <!-- Each button is wrapped with its own model picker so the two
                   stay together when the toolbar wraps. Left loose, the row
                   reflows into pairing every button with the next tool's
                   select. -->
              <span class="tool">
                <button id="prompt-improve" type="button" class="secondary" title="Rewrite the prompt with more detail">✨ Improve</button>
                <select id="improve-model" aria-label="Model used by Improve" title="Which model rewrites the prompt"></select>
              </span>
              <span class="tool">
                <button id="prompt-describe" type="button" class="secondary" title="Caption an image into the prompt box">🔍 Describe</button>
                <select id="describe-model" aria-label="Model used by Describe" title="Which model captions the image"></select>
              </span>
              <input id="describe-file" type="file" accept="image/*" hidden />
              <button id="prompt-save" type="button" class="secondary" title="Save current prompt">Save</button>
              <button id="prompt-del" type="button" class="secondary" title="Delete selected prompt">Delete</button>
            </div>
            <!-- What the two pickers above will actually do, kept out of the
                 option names so those stay scannable. -->
            <p class="tool-notes">
              <span id="improve-note"></span>
              <span id="describe-note"></span>
            </p>
            <div class="params-head">
              <span>Parameters</span>
              <button id="reset-btn" type="button" class="secondary tiny">Reset</button>
            </div>
            <div id="fields"></div>
            <div class="actions">
              <button id="generate-btn" type="submit">Generate</button>
            </div>
          </form>
        </section>

        <section class="panel output">
          <div id="status" class="status hidden"></div>
          <div id="result" class="result"></div>
        </section>
      </main>

      <footer>
        <div id="spend" class="spend hidden"></div>
        <span id="footer-note"></span>
      </footer>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
